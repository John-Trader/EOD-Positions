name: Mirror sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: mirror-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Save this workflow file (fallback copy for the build step)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Best-effort copy. The build step prefers the file currently on
          # main and only uses this fallback if it's missing there. Must not
          # fail the run -- a missing file is handled (and loudly refused)
          # in the build step.
          gh api "repos/John-Trader/EOD-Positions/contents/.github/workflows/sync.yml?ref=main" --jq '.content' 2>/dev/null | base64 -d > /tmp/sync.yml.bak 2>/dev/null || true

      - name: Build mirrored repo (no push yet)
        id: build
        env:
          PRIMARY_READ_TOKEN: ${{ secrets.PRIMARY_READ_TOKEN }}
          PRIMARY_REPO: ${{ secrets.PRIMARY_REPO }}
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PRIMARY_READ_TOKEN:-}" || { echo "missing PRIMARY_READ_TOKEN secret"; exit 1; }
          test -n "${PRIMARY_REPO:-}" || { echo "missing PRIMARY_REPO secret"; exit 1; }
          test -n "${MIRROR_PAT:-}" || { echo "missing MIRROR_PAT secret"; exit 1; }
          BACKUP="John-Trader/EOD-Positions"

          rm -rf mirror.git
          git clone --bare "https://x-access-token:${PRIMARY_READ_TOKEN}@github.com/${PRIMARY_REPO}.git" mirror.git
          cd mirror.git
          # Scrub authorship so the public mirror can't be traced to the primary account.
          git filter-branch --force --env-filter '
          export GIT_AUTHOR_NAME="John Trader"
          export GIT_AUTHOR_EMAIL="john-trader@users.noreply.github.com"
          export GIT_COMMITTER_NAME="John Trader"
          export GIT_COMMITTER_EMAIL="john-trader@users.noreply.github.com"
          ' --tag-name-filter cat -- --all
          # Drop filter-branch's backup refs; they must never be pushed.
          git for-each-ref --format='%(refname)' refs/original/ | xargs -r -n1 git update-ref -d

          # Embed this workflow file into the rewritten main tree, so the single
          # push below carries both the mirrored content and the workflow itself.
          # The old design pushed twice (~30s apart: mirror push, then a separate
          # restore push), which made GitHub Pages start a build for the first
          # push and then kill it as superseded -> permanent red X's on the
          # deployments page. One push per run fixes that.
          #
          # Which copy to embed: prefer the one currently on backup main, so an
          # out-of-band edit to this file (e.g. via the API) is never reverted
          # by a sync run -- the tree comparison below then sees no change and
          # skips the push. Only if the file is missing on main do we restore
          # the run-start fallback copy; if neither exists we refuse to push
          # rather than orphan the schedule.
          export GIT_AUTHOR_NAME="John Trader"
          export GIT_AUTHOR_EMAIL="john-trader@users.noreply.github.com"
          export GIT_COMMITTER_NAME="John Trader"
          export GIT_COMMITTER_EMAIL="john-trader@users.noreply.github.com"
          export GIT_INDEX_FILE="$PWD/.tmp-restore-index"
          rm -f "$GIT_INDEX_FILE"
          main_sha=$(git rev-parse refs/heads/main)
          git read-tree "$main_sha"
          if gh api "repos/$BACKUP/contents/.github/workflows/sync.yml?ref=main" --jq '.content' 2>/dev/null | base64 -d > /tmp/sync_current.yml 2>/dev/null && test -s /tmp/sync_current.yml; then
            blob=$(git hash-object -w /tmp/sync_current.yml)
            echo "embedding sync.yml from current main"
          elif test -s /tmp/sync.yml.bak; then
            blob=$(git hash-object -w /tmp/sync.yml.bak)
            echo "sync.yml missing on main; restoring fallback copy"
          else
            echo "sync.yml missing on main and no fallback copy; refusing to push"
            exit 1
          fi
          git update-index --add --cacheinfo "100644,$blob,.github/workflows/sync.yml"
          new_tree=$(git write-tree)
          rm -f "$GIT_INDEX_FILE"
          unset GIT_INDEX_FILE

          # Push only when something actually changed: compare the new tree
          # against backup main's current tree. Identical trees -> skip, so
          # idle runs don't trigger pointless Pages builds every 15 minutes.
          current_tree=$(gh api "repos/$BACKUP/commits/main" --jq '.commit.tree.sha' 2>/dev/null || echo "")
          if [ -n "$current_tree" ] && [ "$new_tree" = "$current_tree" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes vs backup main; nothing to push."
            exit 0
          fi

          new_commit=$(git commit-tree "$new_tree" -p "$main_sha" -m "Restore sync workflow")
          git update-ref refs/heads/main "$new_commit" "$main_sha"

          git remote set-url origin "https://x-access-token:${MIRROR_PAT}@github.com/${BACKUP}.git"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Mirror built; single push pending."

      - name: Sync releases (notes and assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_READ_TOKEN: ${{ secrets.PRIMARY_READ_TOKEN }}
          PRIMARY_REPO: ${{ secrets.PRIMARY_REPO }}
        run: |
          set -euo pipefail
          BACKUP="John-Trader/EOD-Positions"
          PRIMARY="${PRIMARY_REPO:?missing PRIMARY_REPO secret}"

          papi() {
            if [ -n "${PRIMARY_READ_TOKEN:-}" ]; then
              GH_TOKEN="$PRIMARY_READ_TOKEN" gh api "$@"
            else
              gh api "$@"
            fi
          }
          pdl() {
            if [ -n "${PRIMARY_READ_TOKEN:-}" ]; then
              GH_TOKEN="$PRIMARY_READ_TOKEN" gh release download "$@"
            else
              gh release download "$@"
            fi
          }

          # Oldest first: GitHub's "Latest" badge goes to the most recently
          # *published* release, so (re)creating in this order keeps the badge
          # on the newest version instead of the oldest.
          tags=$(papi "repos/$PRIMARY/releases?per_page=100" --jq 'reverse | .[].tag_name')

          # Canonical signature of a release JSON blob: name, body, flags,
          # and asset names+sizes. Used to skip releases that already match.
          sig() {
            jq -r '[.name // "", .body // "", .draft, .prerelease, (.assets | map("\(.name) \(.size)") | sort | join("\n"))] | join("\u0000")'
          }

          for tag in $tags; do
            echo "== release $tag"
            meta=$(papi "repos/$PRIMARY/releases/tags/$tag")

            # Skip releases that already match on the backup. Without this,
            # every 15-minute run deleted and recreated ALL releases
            # newest-first, which flipped GitHub's "Latest" badge to the
            # oldest version (recreated last) and re-uploaded every asset.
            if bmeta=$(gh api "repos/$BACKUP/releases/tags/$tag" 2>/dev/null); then
              if [ "$(echo "$meta" | sig)" = "$(echo "$bmeta" | sig)" ]; then
                echo "unchanged; skipping"
                continue
              fi
              echo "differs from backup; recreating"
              gh release delete "$tag" -R "$BACKUP" --yes
            fi

            name=$(echo "$meta" | jq -r '.name // empty')
            draft=$(echo "$meta" | jq -r '.draft')
            prerelease=$(echo "$meta" | jq -r '.prerelease')
            echo "$meta" | jq -r '.body // ""' > /tmp/notes.md

            work=$(mktemp -d)
            pdl "$tag" -R "$PRIMARY" -D "$work" --clobber >/dev/null 2>&1 || true

            args=()
            [ -n "${name:-}" ] && args+=(--title "$name")
            [ "$draft" = "true" ] && args+=(--draft)
            [ "$prerelease" = "true" ] && args+=(--prerelease)
            assets=()
            while IFS= read -r -d '' f; do assets+=("$f"); done < <(find "$work" -maxdepth 1 -type f -print0)

            gh release create "$tag" -R "$BACKUP" --notes-file /tmp/notes.md "${args[@]}" "${assets[@]}"
            rm -rf "$work"
          done

          # Remove backup releases that no longer exist on the primary repo.
          bt=$(gh api "repos/$BACKUP/releases?per_page=100" --jq '.[].tag_name')
          for btag in $bt; do
            if ! printf '%s\n' "$tags" | grep -qx "$btag"; then
              echo "removing stale release $btag"
              gh release delete "$btag" -R "$BACKUP" --yes
            fi
          done

      - name: Push mirror (single push)
        id: push
        # Runs even if release sync failed: the workflow file travels inside
        # this same push, so a failed run can never wipe it and orphan the
        # 15-minute schedule the way the old two-push design could.
        if: always()
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          set -euo pipefail
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "build step did not succeed; nothing to push"
            exit 0
          fi
          if [ "${{ steps.build.outputs.changed }}" != "true" ]; then
            echo "no changes; skipping push"
            exit 0
          fi
          cd mirror.git
          attempt=1
          until git push --force origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt 3 ]; then echo "push failed after 3 attempts"; exit 1; fi
            sleep 10
          done

      - name: Ensure Pages builds the new commit
        # Safety net (added 2026-09-20, hardened 2026-09-23): the v3.9.0 push
        # succeeded but GitHub never created a Pages build for it, leaving the
        # live site stale; same for v4.7.3 on 2026-09-23. After every real
        # push, confirm a Pages build exists for the new main commit. If
        # GitHub's automatic build hasn't appeared within ~4 minutes, push an
        # empty commit -- GitHub always builds a new commit on main, and the
        # fine-grained token lacks Pages permission so POST /pages/builds 403s.
        # The empty commit shares the same tree, so the next sync run sees no
        # changes and skips its push; it just rides along on main.
        if: always()
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          set -uo pipefail
          if [ "${{ steps.build.outputs.changed }}" != "true" ]; then
            echo "no push this run; nothing to verify"
            exit 0
          fi
          if [ "${{ steps.push.outcome }}" != "success" ]; then
            echo "push step did not succeed; skipping Pages check"
            exit 0
          fi
          BACKUP="John-Trader/EOD-Positions"
          export GH_TOKEN="$MIRROR_PAT"
          sha=$(gh api "repos/$BACKUP/commits/main" --jq '.sha')
          echo "new main: $sha"
          for i in $(seq 1 8); do
            if gh api "repos/$BACKUP/pages/builds?per_page=10" --jq '.[].commit' | grep -qx "$sha"; then
              echo "Pages build found for $sha"
              exit 0
            fi
            echo "no Pages build yet (attempt $i/8); waiting 30s"
            sleep 30
          done
          echo "No automatic Pages build; pushing an empty commit to force one."
          tree=$(gh api "repos/$BACKUP/commits/main" --jq '.commit.tree.sha')
          new_commit=$(gh api -X POST "repos/$BACKUP/git/commits" \
            -f message="Trigger Pages rebuild" -f tree="$tree" -f parents[]="$sha" --jq '.sha')
          gh api -X PATCH "repos/$BACKUP/git/refs/heads/main" -f sha="$new_commit" >/dev/null \
            && echo "empty commit pushed; Pages will build it" \
            || echo "WARNING: empty-commit push failed; site may stay stale until next push"
