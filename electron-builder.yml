appId: com.levifasten.positioncalc
productName: Position Size Calculator
asar: true
directories:
  output: dist
files:
  - electron/**
  - tws-bridge/server.js
  - tws-bridge/flex.js
  - index.html
  - app.css
  - ledger.js
  - state-schema.js
  - state-store.js
  - sync.js
  - manifest.webmanifest
  - sw.js
  - icon.svg
  - build/icon.png
  - package.json
  - "!tws-bridge/node_modules/**"
  - "!_test_*"
  - "!_serve.js"
  - "!_smoke_browser.js"
  - "!_golden_fixtures.json"
  - "!tools/**"
  - "!src/**"
  - "!tailwind.config.js"
  - "!.git/**"
  - "!.devin/**"
win:
  target: portable
  icon: build/icon.png
  artifactName: "PositionCalc-${version}-portable.exe"
